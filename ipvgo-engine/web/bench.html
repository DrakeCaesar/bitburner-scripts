<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IPvGO exploiter bench</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #141414;
        --panel: #1c1c1c;
        --panel-2: #222222;
        --line: #303030;
        --text: #d7d7d7;
        --dim: #8a8a8a;
        --accent: #43bf43;
        --accent-2: #893bc8;
        --warn: #e0b040;
        --bad: #e05555;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 14px;
        padding: 12px 18px;
        border-bottom: 1px solid var(--line);
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: 0.4px; }
      header .sub { color: var(--dim); font-size: 12px; }
      .pill {
        margin-left: auto;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--panel);
        font-size: 12px;
      }
      .pill.running { border-color: var(--accent); color: var(--accent); }
      .pill.finished { border-color: var(--accent); color: var(--accent); }
      .pill.failed { border-color: var(--bad); color: var(--bad); }
      main {
        display: grid;
        grid-template-columns: minmax(260px, 300px) minmax(0, 1fr) minmax(240px, 320px);
        gap: 14px;
        padding: 14px 18px 22px;
        align-items: start;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        min-width: 0;
      }
      section h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--dim);
        margin: 0 0 10px;
        font-weight: 600;
      }
      label.field { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
      label.field span { color: var(--dim); }
      input, select {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 4px 6px;
        font-size: 12px;
        width: 110px;
      }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
      .chip {
        cursor: pointer;
        user-select: none;
        padding: 4px 9px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--dim);
        font-size: 12px;
      }
      .chip.on { border-color: var(--accent); color: var(--accent); background: #1d2a1d; }
      .buttons { display: flex; gap: 8px; margin-top: 4px; }
      button {
        flex: 1;
        cursor: pointer;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 600;
      }
      button.primary { border-color: var(--accent); color: #d8ffd8; background: #1d2a1d; }
      button:disabled { opacity: 0.4; cursor: default; }
      #boardWrap { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
      #board {
        display: block;
        width: 100%;
        max-width: min(100%, 60vh);
        aspect-ratio: 1 / 1;
        height: auto;
      }
      .tableScroll { overflow-x: auto; }
      .info { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--dim); font-size: 12px; }
      .info b { color: var(--text); font-weight: 600; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { padding: 4px 3px; text-align: right; }
      th { color: var(--dim); font-weight: 500; border-bottom: 1px solid var(--line); }
      th:first-child, td:first-child { text-align: left; }
      tr.total td { border-top: 1px solid var(--line); color: var(--text); font-weight: 600; }
      .bar { height: 6px; border-radius: 3px; background: #2b2b2b; overflow: hidden; min-width: 54px; }
      .bar > i { display: block; height: 100%; background: var(--accent); }
      .bar.low > i { background: var(--warn); }
      .bar.bad > i { background: var(--bad); }
      .win { color: var(--accent); }
      .loss { color: var(--bad); }
      #history { list-style: none; margin: 0; padding: 0; }
      #history li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid #262626; }
      #history li span:first-child { color: var(--dim); }
      .err { color: var(--bad); font-size: 12px; white-space: pre-wrap; margin-top: 8px; }
      .hint { color: var(--dim); font-size: 11px; margin-top: 8px; }
      @media (max-width: 1280px) {
        main { grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); }
        main > section:last-child { grid-column: 1 / -1; }
      }
      @media (max-width: 860px) {
        main { grid-template-columns: minmax(0, 1fr); }
        main > section:last-child { grid-column: auto; }
        #board { max-width: 100%; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>IPvGO exploiter bench</h1>
      <span class="sub">Black = policy expectimax &nbsp;|&nbsp; White = scripted faction</span>
      <span id="status" class="pill">idle</span>
    </header>

    <main>
      <section>
        <h2>Run</h2>
        <div class="chips" id="factions"></div>
        <label class="field"><span>Board size</span>
          <select id="size">
            <option>5</option><option>7</option><option>9</option><option>13</option><option>19</option>
          </select>
        </label>
        <label class="field"><span>Budget type</span>
          <select id="budgetMode">
            <option value="time">Time (ms)</option>
            <option value="iterations">Iterations (nodes)</option>
          </select>
        </label>
        <label class="field"><span id="budgetLabel">Think budget (ms)</span><input id="budget" type="number" min="1" step="50" value="200" /></label>
        <label class="field"><span>Games per faction</span><input id="games" type="number" min="1" max="500" value="20" /></label>
        <label class="field"><span>Seed</span><input id="seed" type="number" min="1" value="1" /></label>
        <div class="buttons">
          <button id="start" class="primary">Start</button>
          <button id="stop">Stop</button>
        </div>
        <div class="hint" id="hint">Settings are remembered across reloads.</div>
      </section>

      <section>
        <h2>Board</h2>
        <div id="boardWrap">
          <svg id="board" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
          <div class="info" id="info"></div>
        </div>
      </section>

      <section>
        <h2>Results</h2>
        <div class="tableScroll">
          <table>
            <thead>
              <tr><th>faction</th><th>games</th><th>W</th><th>L</th><th>win %</th><th>margin</th><th>ms</th><th></th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <h2 style="margin-top: 14px">Recent games</h2>
        <ul id="history"></ul>
        <div class="err" id="error"></div>
      </section>
    </main>

    <script>
      const ALL_FACTIONS = ["Netburners", "Slum Snakes", "The Black Hand", "Tetrads", "Daedalus", "Illuminati"]
      const selected = new Set(ALL_FACTIONS)
      let state = null

      // The page is served by the engine server, but it still works when opened
      // straight from disk as long as the server runs on its default port.
      const API_BASE =
        location.protocol === "file:" ? "http://localhost:3010" : ""

      const STORAGE_KEY = "ipvgo-bench-form-v1"
      const DEFAULT_FORM = {
        size: "5",
        budgetMode: "time",
        budget: "200",
        games: "20",
        seed: "1",
        factions: ALL_FACTIONS.slice(),
      }

      const el = (id) => document.getElementById(id)

      function readForm() {
        return {
          size: el("size").value,
          budgetMode: el("budgetMode").value,
          budget: el("budget").value,
          games: el("games").value,
          seed: el("seed").value,
          factions: Array.from(selected),
        }
      }

      function saveForm() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(readForm()))
        } catch {
          /* storage disabled */
        }
      }

      function loadForm() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY)
          if (!raw) return { ...DEFAULT_FORM }
          const stored = JSON.parse(raw)
          const budgetMode = stored.budgetMode === "iterations" ? "iterations" : "time"
          const factions = Array.isArray(stored.factions)
            ? stored.factions.filter((f) => ALL_FACTIONS.includes(f))
            : DEFAULT_FORM.factions.slice()
          return {
            size: String(stored.size ?? DEFAULT_FORM.size),
            budgetMode,
            budget: String(stored.budget ?? (budgetMode === "iterations" ? 50000 : 200)),
            games: String(stored.games ?? DEFAULT_FORM.games),
            seed: String(stored.seed ?? DEFAULT_FORM.seed),
            factions: factions.length > 0 ? factions : DEFAULT_FORM.factions.slice(),
          }
        } catch {
          return { ...DEFAULT_FORM }
        }
      }

      function applyForm(form) {
        el("size").value = form.size
        el("budgetMode").value = form.budgetMode
        el("budget").value = form.budget
        el("games").value = form.games
        el("seed").value = form.seed
        selected.clear()
        for (const faction of form.factions) selected.add(faction)
        updateBudgetLabel()
      }

      function updateBudgetLabel() {
        const iterations = el("budgetMode").value === "iterations"
        el("budgetLabel").textContent = iterations ? "Node budget" : "Think budget (ms)"
        el("budget").step = iterations ? "1000" : "50"
      }

      function renderFactionChips() {
        const size = Number(el("size").value)
        const worldDaemon = size === 19
        const wrap = el("factions")
        wrap.innerHTML = ""
        const list = worldDaemon ? ["WorldDaemon"] : ALL_FACTIONS
        for (const faction of list) {
          const chip = document.createElement("div")
          chip.className = "chip" + (selected.has(faction) || worldDaemon ? " on" : "")
          chip.textContent = faction
          chip.addEventListener("click", () => {
            if (worldDaemon) return
            if (selected.has(faction)) selected.delete(faction)
            else selected.add(faction)
            renderFactionChips()
            saveForm()
          })
          wrap.appendChild(chip)
        }
      }

      // The board must fit the whole stone plus its last-move ring inside the
      // viewBox, otherwise edge stones are clipped. Padding therefore depends on
      // the stone size, which depends on the padding: iterate to a fixed point.
      function boardGeometry(n) {
        let pad = 6
        let step = n > 1 ? (100 - pad * 2) / (n - 1) : 100 - pad * 2
        let stoneR = step * 0.45
        let ringW = Math.max(step * 0.09, 0.4)
        let ringR = stoneR + Math.max(step * 0.16, 0.8)
        for (let i = 0; i < 8; i++) {
          const needed = ringR + ringW / 2 + 0.6
          if (pad >= needed) break
          pad = needed
          step = n > 1 ? (100 - pad * 2) / (n - 1) : 100 - pad * 2
          stoneR = step * 0.45
          ringW = Math.max(step * 0.09, 0.4)
          ringR = stoneR + Math.max(step * 0.16, 0.8)
        }
        return {
          pad,
          step,
          span: 100 - pad * 2,
          stoneR,
          ringW,
          ringR,
          lineW: Math.max(step * 0.05, 0.15),
          edgeW: Math.max(step * 0.04, 0.12),
          dotR: Math.max(step * 0.08, 0.25),
          labelSize: Math.max(step * 0.5, 2),
        }
      }

      function drawBoard(board, current, size) {
        const svg = el("board")
        if (!board || board.length === 0) {
          svg.innerHTML = '<text x="50" y="52" fill="#555" font-size="5" text-anchor="middle">no game running</text>'
          svg.setAttribute("viewBox", "0 0 100 100")
          return
        }
        const n = board.length
        const g = boardGeometry(n)
        const { pad, step, span, stoneR, ringW, ringR, lineW, edgeW, dotR, labelSize } = g
        const parts = ['<rect x="0" y="0" width="100" height="100" fill="#171717" />']
        for (let i = 0; i < n; i++) {
          const p = pad + i * step
          parts.push(`<line x1="${pad}" y1="${p}" x2="${pad + span}" y2="${p}" stroke="#4a4a4a" stroke-width="${lineW}" />`)
          parts.push(`<line x1="${p}" y1="${pad}" x2="${p}" y2="${pad + span}" stroke="#4a4a4a" stroke-width="${lineW}" />`)
        }
        const starSets = { 19: [3, 9, 15], 13: [3, 6, 9], 9: [2, 4, 6], 7: [3], 5: [] }
        const stars = starSets[n] || []
        for (const sx of stars) {
          for (const sy of stars) {
            parts.push(
              `<circle cx="${pad + sx * step}" cy="${pad + (n - 1 - sy) * step}" r="${Math.max(0.4, step * 0.1)}" fill="#4a4a4a" />`
            )
          }
        }
        const parse = (value) => (value && value !== "pass" ? value.split(",").map(Number) : null)
        const lastBlack = current ? parse(current.lastBlack) : null
        const lastWhite = current ? parse(current.lastWhite) : null
        for (let x = 0; x < n; x++) {
          for (let y = 0; y < n; y++) {
            const c = board[x][y]
            const cx = pad + x * step
            const cy = pad + (n - 1 - y) * step
            if (c === "#") {
              const s = step * 0.8
              parts.push(`<rect x="${cx - s / 2}" y="${cy - s / 2}" width="${s}" height="${s}" rx="${s * 0.15}" fill="#2a2a2a" />`)
              parts.push(
                `<line x1="${cx - s * 0.28}" y1="${cy - s * 0.28}" x2="${cx + s * 0.28}" y2="${cy + s * 0.28}" stroke="#555" stroke-width="${lineW}" />`
              )
              parts.push(
                `<line x1="${cx + s * 0.28}" y1="${cy - s * 0.28}" x2="${cx - s * 0.28}" y2="${cy + s * 0.28}" stroke="#555" stroke-width="${lineW}" />`
              )
            } else if (c === "X") {
              parts.push(
                `<circle cx="${cx}" cy="${cy}" r="${stoneR}" fill="#0b0b0b" stroke="#6f6f6f" stroke-width="${edgeW}" />`
              )
            } else if (c === "O") {
              parts.push(
                `<circle cx="${cx}" cy="${cy}" r="${stoneR}" fill="#e8e8e8" stroke="#8f8f8f" stroke-width="${edgeW}" />`
              )
            } else {
              parts.push(`<circle cx="${cx}" cy="${cy}" r="${dotR}" fill="#555" />`)
            }
          }
        }
        if (lastBlack) {
          parts.push(
            `<circle cx="${pad + lastBlack[0] * step}" cy="${pad + (n - 1 - lastBlack[1]) * step}" r="${ringR}" fill="none" stroke="#43bf43" stroke-width="${ringW}" />`
          )
        }
        if (lastWhite) {
          parts.push(
            `<circle cx="${pad + lastWhite[0] * step}" cy="${pad + (n - 1 - lastWhite[1]) * step}" r="${ringR}" fill="none" stroke="#893bc8" stroke-width="${ringW}" />`
          )
        }
        if (lastBlack) {
          const lx = pad + lastBlack[0] * step
          const ly = pad + (n - 1 - lastBlack[1]) * step
          parts.push(
            `<text x="${lx}" y="${ly}" fill="#67e867" font-size="${labelSize}" font-weight="600" text-anchor="middle" dominant-baseline="central">B</text>`
          )
        }
        if (lastWhite) {
          const lx = pad + lastWhite[0] * step
          const ly = pad + (n - 1 - lastWhite[1]) * step
          parts.push(
            `<text x="${lx}" y="${ly}" fill="#a85cf0" font-size="${labelSize}" font-weight="600" text-anchor="middle" dominant-baseline="central">W</text>`
          )
        }
        svg.setAttribute("viewBox", "0 0 100 100")
        svg.setAttribute("preserveAspectRatio", "xMidYMid meet")
        svg.innerHTML = parts.join("")
      }

      function renderInfo(s) {
        const cur = s.current
        if (!cur) {
          el("info").innerHTML = s.running ? "<span>starting…</span>" : "<span>press Start to run a benchmark</span>"
          return
        }
        const bits = []
        bits.push(`<span><b>${cur.faction}</b> (${cur.factionIndex + 1}/${cur.factionCount})</span>`)
        bits.push(`<span>game <b>${cur.game}</b>/${cur.games}</span>`)
        bits.push(`<span>move <b>${cur.move}</b></span>`)
        if (cur.thinking) bits.push('<span style="color:var(--warn)">thinking…</span>')
        if (cur.depth != null) bits.push(`<span>depth <b>${cur.depth}</b></span>`)
        if (cur.nodes != null) bits.push(`<span>nodes <b>${cur.nodes}</b></span>`)
        if (cur.ms != null) bits.push(`<span>think <b>${Math.round(cur.ms)}</b> ms</span>`)
        bits.push(
          `<span>score <b>${(cur.blackScore ?? 0).toFixed(1)}</b> / <b>${(cur.whiteScore ?? 0).toFixed(1)}</b></span>`
        )
        if (cur.lastBlack) bits.push(`<span>B <b>${cur.lastBlack}</b></span>`)
        if (cur.lastWhite) bits.push(`<span>W <b>${cur.lastWhite}</b></span>`)
        el("info").innerHTML = bits.join("")
      }

      function renderRows(s) {
        const body = el("rows")
        body.innerHTML = ""
        let games = 0
        let wins = 0
        for (const row of s.rows) {
          games += row.games
          wins += row.wins
          const pct = row.winRate
          const cls = row.games === 0 ? "" : pct >= 99.999 ? "" : pct >= 50 ? "low" : "bad"
          const tr = document.createElement("tr")
          tr.innerHTML =
            `<td>${row.faction}</td>` +
            `<td>${row.games}</td>` +
            `<td class="${row.losses === 0 && row.games > 0 ? "win" : ""}">${row.wins}</td>` +
            `<td class="${row.losses > 0 ? "loss" : ""}">${row.losses}</td>` +
            `<td>${pct.toFixed(1)}</td>` +
            `<td>${row.avgMargin >= 0 ? "+" : ""}${row.avgMargin.toFixed(1)}</td>` +
            `<td>${row.avgMs > 0 ? Math.round(row.avgMs) : "-"}</td>` +
            `<td><div class="bar ${cls}"><i style="width:${Math.min(100, pct)}%"></i></div></td>`
          body.appendChild(tr)
        }
        const tr = document.createElement("tr")
        tr.className = "total"
        tr.innerHTML =
          `<td>all factions</td><td>${games}</td><td>${wins}</td><td>${games - wins}</td>` +
          `<td>${games > 0 ? ((100 * wins) / games).toFixed(1) : "0.0"}</td><td></td><td></td><td></td>`
        body.appendChild(tr)
      }

      function renderHistory(s) {
        const list = el("history")
        list.innerHTML = ""
        for (const item of s.history.slice(0, 12)) {
          const li = document.createElement("li")
          const margin = item.margin >= 0 ? `+${item.margin.toFixed(1)}` : item.margin.toFixed(1)
          li.innerHTML =
            `<span>${item.faction} #${item.game}</span>` +
            `<span class="${item.win ? "win" : "loss"}">${item.win ? "WIN" : "LOSS"} ${margin}</span>`
          list.appendChild(li)
        }
      }

      function renderStatus(s) {
        const pill = el("status")
        pill.className = "pill"
        if (s.running) {
          pill.classList.add("running")
          const cur = s.current
          pill.textContent = cur ? `running · ${cur.faction} ${cur.game}/${cur.games}` : "running"
        } else if (s.finished) {
          const ok = s.failures === 0
          pill.classList.add(ok ? "finished" : "failed")
          pill.textContent = ok ? "finished · 100% everywhere" : `finished · ${s.failures} faction(s) below 100%`
        } else {
          pill.textContent = "idle"
        }
        el("error").textContent = s.error || ""
      }

      function render() {
        if (!state) return
        renderStatus(state)
        renderRows(state)
        renderHistory(state)
        renderInfo(state)
        const size = state.options?.size ?? Number(el("size").value)
        drawBoard(state.current?.board ?? null, state.current, size)
        el("start").disabled = state.running
        el("stop").disabled = !state.running
      }

      async function poll() {
        try {
          const res = await fetch(`${API_BASE}/api/bench/state`)
          state = await res.json()
          render()
        } catch {
          el("status").textContent = "server offline"
          el("status").className = "pill failed"
          el("error").textContent =
            "Cannot reach the engine server. Run `pnpm run server` at the repo root, " +
            "then open http://localhost:3010/bench"
        }
      }

      el("start").addEventListener("click", async () => {
        const size = Number(el("size").value)
        const mode = el("budgetMode").value
        const budget = Math.max(1, Math.floor(Number(el("budget").value) || 1))
        const body = {
          size,
          games: Number(el("games").value),
          seed: Number(el("seed").value),
          budgetMs: mode === "time" ? budget : 0,
          iterations: mode === "iterations" ? budget : 0,
          factions: size === 19 ? ["WorldDaemon"] : Array.from(selected),
        }
        if (body.factions.length === 0) body.factions = null
        saveForm()
        el("start").disabled = true
        await fetch(`${API_BASE}/api/bench/start`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        })
        await poll()
      })

      el("stop").addEventListener("click", async () => {
        await fetch(`${API_BASE}/api/bench/stop`, { method: "POST" })
        await poll()
      })

      for (const id of ["size", "games", "seed", "budget"]) {
        el(id).addEventListener("change", saveForm)
        el(id).addEventListener("input", saveForm)
      }

      el("size").addEventListener("change", renderFactionChips)

      el("budgetMode").addEventListener("change", () => {
        const iterations = el("budgetMode").value === "iterations"
        const current = Number(el("budget").value) || 0
        // Swap in a comparable default when the stored number is meaningless for
        // the new unit (200 nodes or 50000 ms would both be nonsense).
        if (iterations && current < 1000) el("budget").value = "50000"
        if (!iterations && current > 5000) el("budget").value = "200"
        updateBudgetLabel()
        saveForm()
      })

      applyForm(loadForm())
      renderFactionChips()
      el("stop").disabled = true
      poll()
      setInterval(poll, 120)
    </script>
  </body>
</html>
